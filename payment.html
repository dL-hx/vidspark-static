<script>
(function(){
  var els = document.querySelectorAll('span,div,a,h1,h2,p');
  for (var i = 0; i < els.length; i++){
    var el = els[i];
    if (el.textContent.replace(/\s+/g,'') !== 'VidSpark') continue;
    if (el.children.length > 1) continue;
    var cls = el.className || '';
    var brand = /font-bold|studio-brand-name|tracking-tight|text-3xl/.test(cls) ||
      (el.children.length === 1 && /brand-gradient|text-brand-|text-blue-|text-purple-|text-violet-/.test(el.children[0].className || ''));
    if (!brand) continue;
    var t = el.closest('.cursor-pointer') || el.parentElement;
    if (!t || t.__vsBrand) continue;
    t.__vsBrand = 1;
    t.style.cursor = 'pointer';
    t.addEventListener('click', function(e){ e.preventDefault(); location.href = 'index.html'; });
  }
  /* 按路由参数 plan/cycle 渲染，与线上 #/payment?plan=&cycle= 一致 */
  var q = new URLSearchParams(location.search);
  var plan = q.get('plan') || 'plus';
  var cycle = q.get('cycle') || 'monthly';
  var meta = {
    plus:  { name: '增强版 Plus', monthly: '15.90',  yearly: '152.64' },
    pro:   { name: '专业版 Pro',  monthly: '39.90',  yearly: '383.04' },
    ultra: { name: '旗舰版 Ultra', monthly: '89.90', yearly: '863.04' }
  };
  var info = meta[plan] || meta.plus;
  var h2 = document.querySelector('main h2');
  if (h2){
    h2.textContent = info.name + ' 会员订阅';
    if (h2.nextElementSibling) h2.nextElementSibling.textContent = cycle === 'yearly' ? '年付套餐' : '月付套餐';
  }
  var price = document.querySelector('.text-3xl.font-bold.text-amber-400');
  if (price) price.textContent = '¥' + (cycle === 'yearly' ? info.yearly : info.monthly);
  /* 订单 30 分钟倒计时 */
  var clockWrap = document.querySelector('main .fa-clock');
  if (clockWrap){
    clockWrap = clockWrap.parentNode;
    var left = 29 * 60 + 59;
    var renderClock = function(){
      var mm = Math.floor(left / 60), ss = left % 60;
      clockWrap.innerHTML = '<i class="fa-regular fa-clock mr-1"></i> 订单将在 ' + mm + ':' + (ss < 10 ? '0' : '') + ss + ' 后过期 ';
      if (left > 0) left--;
    };
    renderClock();
    setInterval(renderClock, 1000);
  }
  var backSel = document.querySelector('header button');
  if (backSel) backSel.addEventListener('click', function(){ location.href = 'membership.html'; });
})();
</script>
